<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk System - Log In</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-wrapper">

    <div class="glass-panel login-card text-center">
        <!-- SVG Logo -->
        <div class="mb-4">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
                <defs>
                    <linearGradient id="login-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00d2ff" />
                        <stop offset="100%" stop-color="#9d4edd" />
                    </linearGradient>
                </defs>
                <path d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z" fill="url(#login-grad)"/>
            </svg>
        </div>

        <h1 class="h3 mb-2 fw-bold text-white">Help Desk Workspace</h1>
        <p class="text-secondary small mb-4">Provide your credentials to access the support console</p>

        <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="text-start mb-3">
                <label class="form-label small text-white-50">Email Address</label>
                <input type="email" id="email" class="form-control form-control-custom" placeholder="alex.admin@company.com" required>
                <div class="text-danger small mt-1" id="emailError" style="display: none;">Please enter a valid company email.</div>
            </div>

            <!-- Password -->
            <div class="text-start mb-4 position-relative">
                <div class="d-flex justify-content-between">
                    <label class="form-label small text-white-50">Password</label>
                    <a href="#" class="small text-decoration-none" style="color: var(--accent-blue);" id="forgotBtn">Forgot?</a>
                </div>
                <input type="password" id="password" class="form-control form-control-custom" placeholder="••••••••••••" required>
                <div class="text-danger small mt-1" id="passwordError" style="display: none;">Password must be at least 8 characters long.</div>
            </div>

            <!-- Actions -->
            <button type="submit" class="btn btn-accent w-100 mb-3" id="submitBtn">
                <span id="btnText">Sign In to Dashboard</span>
            </button>

            <div class="d-flex align-items-center justify-content-center my-3 text-secondary small">
                <hr class="w-25 border-secondary m-0">
                <span class="mx-3 text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px;">or</span>
                <hr class="w-25 border-secondary m-0">
            </div>

            <button type="button" class="btn btn-outline-light w-100 border-secondary rounded-3" style="padding: 10px;" id="ssoBtn">
                <i class="fa-solid fa-key me-2"></i> Continue with SSO / Okta
            </button>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const ssoBtn = document.getElementById('ssoBtn');
            const forgotBtn = document.getElementById('forgotBtn');

            function isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let valid = true;

                if (!isValidEmail(emailInput.value)) {
                    emailError.style.display = 'block';
                    emailInput.style.borderColor = '#ef4444';
                    valid = false;
                } else {
                    emailError.style.display = 'none';
                    emailInput.style.borderColor = '';
                }

                if (passwordInput.value.length < 8) {
                    passwordError.style.display = 'block';
                    passwordInput.style.borderColor = '#ef4444';
                    valid = false;
                } else {
                    passwordError.style.display = 'none';
                    passwordInput.style.borderColor = '';
                }

                if (!valid) return;

                submitBtn.disabled = true;
                btnText.innerHTML = 'Signing In... <span class="spinner-border spinner-border-sm ms-2"></span>';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1200);
            });

            ssoBtn.addEventListener('click', () => {
                ssoBtn.disabled = true;
                ssoBtn.innerHTML = 'Redirecting... <span class="spinner-border spinner-border-sm ms-2"></span>';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            });

            forgotBtn.addEventListener('click', (e) => {
                e.preventDefault();
                alert('A password reset link has been dispatched to configured emails associated with user accounts.');
            });
        });
    </script>
</body>
</html>
