# Server Configuration
server.port=8080

# Database Configuration (persistent local H2 by default; override with SPRING_DATASOURCE_* for MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./bitly-local-db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# JWT Settings
# Secret must be at least 256 bits (32 bytes / 64 hex characters)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 1 day in milliseconds (86400000 ms)
jwt.expiration=86400000
