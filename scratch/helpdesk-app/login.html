<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Login Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animated Ambient Glow Spheres in Background -->
    <div class="background-glow">
        <div class="sphere sphere-1"></div>
        <div class="sphere sphere-2"></div>
    </div>

    <!-- Login Glassmorphism Card -->
    <div class="glass-card">
        <div style="display: flex; justify-content: center; margin-bottom: 20px;">
            <!-- SVG Logo with Neon Gradient -->
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="hsl(200, 100%, 55%)" />
                        <stop offset="100%" stop-color="hsl(270, 95%, 65%)" />
                    </linearGradient>
                </defs>
                <path d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z" fill="url(#logo-grad)"/>
            </svg>
        </div>

        <h1>Help Desk System</h1>
        <p class="subtitle">Access your support dashboard workspace</p>

        <form id="loginForm" novalidate>
            <!-- Email Input -->
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="name@company.com" 
                    required
                >
                <div id="emailError" class="error-msg">Please enter a valid company email address.</div>
            </div>

            <!-- Password Input -->
            <div class="form-group" style="position: relative;">
                <label for="password" class="form-label">Password</label>
                <a href="#" class="forgot-password" id="forgotPassBtn">Forgot?</a>
                <input 
                    type="password" 
                    id="password" 
                    class="form-control" 
                    placeholder="••••••••••••" 
                    required
                >
                <div id="passwordError" class="error-msg">Password must be at least 8 characters long.</div>
            </div>

            <!-- Options (Remember me) -->
            <div class="options-row">
                <label class="checkbox-container">
                    <input type="checkbox" id="rememberMe">
                    Remember my account
                </label>
            </div>

            <!-- Action Sign In -->
            <button type="submit" class="btn-primary" id="submitBtn">
                <span id="btnText">Sign In to Workspace</span>
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>or</span>
            </div>

            <!-- SSO Integration -->
            <button type="button" class="btn-sso" id="ssoBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Continue with SSO
            </button>
        </form>
    </div>

    <!-- Client-Side Form Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const ssoBtn = document.getElementById('ssoBtn');
            const forgotBtn = document.getElementById('forgotPassBtn');

            // Email validator
            function isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            // Input Event Listeners to remove errors on typing
            emailInput.addEventListener('input', () => {
                emailInput.style.borderColor = '';
                emailError.style.display = 'none';
            });

            passwordInput.addEventListener('input', () => {
                passwordInput.style.borderColor = '';
                passwordError.style.display = 'none';
            });

            // Form Submit handler
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let valid = true;

                // Validate Email
                if (!isValidEmail(emailInput.value)) {
                    emailInput.style.borderColor = 'var(--error-color)';
                    emailError.style.display = 'block';
                    valid = false;
                }

                // Validate Password length
                if (passwordInput.value.length < 8) {
                    passwordInput.style.borderColor = 'var(--error-color)';
                    passwordError.style.display = 'block';
                    valid = false;
                }

                if (!valid) return;

                // Show Loading Spinner on Button
                submitBtn.disabled = true;
                btnText.innerHTML = 'Signing In... <span class="spinner"></span>';

                // Simulate API Authentication Request
                setTimeout(() => {
                    alert('Authentication successful! Routing to Dashboard...');
                    // Redirect simulation (to be created next)
                    window.location.href = 'dashboard.html';
                }, 1500);
            });

            // SSO Handler
            ssoBtn.addEventListener('click', () => {
                ssoBtn.disabled = true;
                ssoBtn.innerHTML = 'Redirecting to Okta IdP... <span class="spinner" style="border-top-color: var(--text-primary);"></span>';
                setTimeout(() => {
                    alert('SSO authentication callback received. Logged in as alex.admin@company.com');
                    window.location.href = 'dashboard.html';
                }, 1200);
            });

            // Forgot password dummy click
            forgotBtn.addEventListener('click', (e) => {
                e.preventDefault();
                alert('A password reset link has been dispatched to configured emails associated with user accounts.');
            });
        });
    </script>
</body>
</html>
